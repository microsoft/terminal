trigger:
  batch: true
  branches:
    include:
      - main
      - feature/*
      - gh-readonly-queue/*
  paths:
    exclude:
      - doc/*
      - samples/*
      - tools/*

pr:
  branches:
    include:
      - main
      - feature/*
  paths:
    exclude:
      - doc/*
      - samples/*
      - tools/*

variables:
  - name: runCodesignValidationInjectionBG
    value: false
  # Stub values for the packaging tasks later.
  - name: XES_APPXMANIFESTVERSION
    value: 0.0.1.0
  - name: XES_PACKAGEVERSIONNUMBER
    value: 0.0.0.1

#     0.0.yyMM.dd##
#     0.0.1904.0900
name: 0.0.$(Date:yyMM).$(Date:dd)$(Rev:rr)

parameters:
  - name: auditMode
    displayName: "Build in Audit Mode (x64)"
    type: boolean
    default: true
  - name: runTests
    displayName: "Run Tests"
    type: boolean
    default: true
  - name: buildPlatforms
    type: object
    default:
      - x64
      - x86
      - arm64

stages:
  - ${{ if eq(parameters.auditMode, true) }}:
    - stage: Audit_x64
      displayName: Audit Mode
      dependsOn: []
      jobs:
        - template: ./templates-v2/job-build-project.yml
          parameters:
            pool:
              ${{ if eq(variables['System.CollectionId'], 'cb55739e-4afe-46a3-970f-1b49d8ee7564') }}:
                name: SHINE-INT-L
              ${{ else }}:
                name: SHINE-OSS-L
              demands: ImageOverride -equals SHINE-VS18-Latest
            buildPlatforms: [x64]
            buildConfigurations: [AuditMode]
            buildEverything: true
            keepAllExpensiveBuildOutputs: false

  - ${{ each platform in parameters.buildPlatforms }}:
    - stage: Build_${{ platform }}
      displayName: Build ${{ platform }}
      dependsOn: []
      jobs:
        - template: ./templates-v2/job-build-project.yml
          parameters:
            pool:
              ${{ if eq(variables['System.CollectionId'], 'cb55739e-4afe-46a3-970f-1b49d8ee7564') }}:
                name: SHINE-INT-L
              ${{ else }}:
                name: SHINE-OSS-L
              demands: ImageOverride -equals SHINE-VS18-Latest
            buildPlatforms:
              - ${{ platform }}
            buildConfigurations: [Release]
            buildEverything: true
            keepAllExpensiveBuildOutputs: false
            ${{ if eq(parameters.runTests, true) }}:
              # Copy the appx files into the bin drop because the LocalTests need them
              afterBuildSteps:
                - pwsh: |-
                    $deps = ./build/scripts/Get-DependenciesFromAppxRecipe.ps1 -Path "$(Terminal.BinDir)/TestHostApp/TestHostApp.build.appxrecipe"
                    $dir = New-Item -Type Directory "$(Terminal.BinDir)/_testDeps"
                    $deps | Copy-Item -Destination $dir -Verbose

    - ${{ if eq(parameters.runTests, true) }}:
      - stage: Test_${{ platform }}
        displayName: Test ${{ platform }}
        dependsOn:
          - Build_${{ platform }}
        condition: succeeded()
        jobs:
          - template: ./templates-v2/job-test-project.yml
            parameters:
              platform: ${{ platform }}
              # The tests might be run more than once; log one artifact per attempt.
              outputArtifactStem: -$(System.JobAttempt)

  - stage: Build_AnyCPU
    displayName: Build Any CPU
    dependsOn: []
    jobs:
      - template: ./templates-v2/job-build-project.yml
        parameters:
          jobName: BuildWPF
          pool:
            ${{ if eq(variables['System.CollectionId'], 'cb55739e-4afe-46a3-970f-1b49d8ee7564') }}:
              name: SHINE-INT-L
            ${{ else }}:
              name: SHINE-OSS-L
            demands: ImageOverride -equals SHINE-VS18-Latest
          buildTerminal: false
          buildWPFDotNetComponents: true
          buildPlatforms:
            - Any CPU
          buildConfigurations: [Release]
          keepAllExpensiveBuildOutputs: false

  - stage: Package
    displayName: Package
    pool:
      ${{ if eq(variables['System.CollectionId'], 'cb55739e-4afe-46a3-970f-1b49d8ee7564') }}:
        name: SHINE-INT-L
      ${{ else }}:
        name: SHINE-OSS-L
      demands: ImageOverride -equals SHINE-VS18-Latest
    dependsOn:
      - ${{ each platform in parameters.buildPlatforms }}:
        - Build_${{ platform }}
      - Build_AnyCPU
    jobs:
      - template: ./templates-v2/job-merge-msix-into-bundle.yml
        parameters:
          jobName: Bundle
          buildConfigurations: [Release]
          buildPlatforms: ${{ parameters.buildPlatforms }}
          branding: Dev

      - template: ./templates-v2/job-package-conpty.yml
        parameters:
          buildConfigurations: [Release]
          buildPlatforms: ${{ parameters.buildPlatforms }}

      - template: ./templates-v2/job-build-package-wpf.yml
        parameters:
          buildConfigurations: [Release]
          buildPlatforms: ${{ parameters.buildPlatforms }}
          packageSymbols: false
