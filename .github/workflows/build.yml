name: Build
on:
  push:
    branches: [ main, dev/dhowett/github-ci, dev/duhowett/hax/github-ci ]
  pull_request:
    branches: [ main, dev/dhowett/github-ci, dev/duhowett/hax/github-ci ]
  workflow_dispatch:

env:
  XES_APPXMANIFESTVERSION: 0.0.1.0
  XES_PACKAGEVERSIONNUMBER: 0.0.0.1-ci
  WT_BRANDING: Canary
  BUILD_CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-2025-vs2026
    name: Build ${{ matrix.arch }}
    strategy:
      matrix:
        arch: [x86, x64, arm64, Any CPU]
    env:
      DEVSHELL_ARCH: ${{ case(matrix.arch == 'Any CPU', 'x64', matrix.arch) }}
      BUILD_PLATFORM: |-
        ${{ case(
              matrix.arch == 'Any CPU', 'AnyCPU',
              matrix.arch == 'x86', 'Win32',
              matrix.arch
        ) }}
      UnpackagedBuildArguments: -PortableMode
    steps:
      - uses: actions/checkout@v7

      - run: |-
          $vsWhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $devShell = & $vsWhere -products * -latest -prerelease -find **\*DevShell.dll
          $instance = & $vsWhere -path $devShell -property instanceId
          "VS_INSTANCE=$instance" >> "$env:GITHUB_ENV"
          "VS_DEVSHELL=$devShell" >> "$env:GITHUB_ENV"
        name: Discover Visual Studio

      - uses: nuget/setup-nuget@v4

      - uses: actions/cache@v6
        with:
          path: obj/*/vcpkg
          key: vcpkg-${{matrix.arch}}-${{hashFiles('vcpkg.json')}}

      - uses: actions/cache@v6
        with:
          path: packages
          key: nuget-${{hashFiles('dep/nuget/packages.config')}}

      - run: |-
          Import-Module $env:VS_DEVSHELL
          Enter-VsDevShell $env:VS_INSTANCE -SkipAutomaticLocation -DevCmdArguments "-arch=${{ env.DEVSHELL_ARCH }} -host_arch=x64"
          & msbuild OpenConsole.slnx `
            "/p:Platform=${{ matrix.arch }}" `
            /p:Configuration=${{ env.BUILD_CONFIGURATION }} `
            /p:WindowsTerminalOfficialBuild=true `
            /p:WindowsTerminalBranding=${{ env.WT_BRANDING }} `
            /clp:Verbosity=Minimal `
            /m /t:Restore
          & nuget restore dep/nuget/packages.config
        name: Restore NuGet Packages

      - run: |-
          Import-Module $env:VS_DEVSHELL
          Enter-VsDevShell $env:VS_INSTANCE -SkipAutomaticLocation -DevCmdArguments "-arch=${{ env.DEVSHELL_ARCH }} -host_arch=x64"
          & msbuild OpenConsole.slnx `
            "/p:Platform=${{ matrix.arch }}" `
            /p:Configuration=Release `
            /p:WindowsTerminalOfficialBuild=true `
            /p:WindowsTerminalBranding=${{ env.WT_BRANDING }} `
            /p:OpenConsoleCleanPCH=true `
            /p:OpenConsoleBuildUnsignedPackage=true `
            /clp:Verbosity=Minimal `
            /m `
            /bl:msbuild.binlog
        name: Build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-${{matrix.arch}}
          path: |-
            msbuild.binlog
            obj/${{matrix.arch}}/vcpkg/**/*.log

      - uses: ./.github/actions/terminal-package-msix-and-portable
        name: Finalize and upload MSIX and unpackaged ZIP
        if: ${{ matrix.arch != 'Any CPU' }}
        with:
          unpackaged-build-arguments: ${{env.UnpackagedBuildArguments}}
          arch: ${{matrix.arch}}

      # This saves ~2GiB per architecture. We won't need these later.
      # Removes:
      # - All .lib that do not have an associated .exp (which would indicate that they are import libs)
      # - All .pdbs from those .libs (which were only used during linking)
      # - Directories ending in Lib (static lib projects that we fully linked into DLLs which may also contain unnecessary resources)
      # - All LocalTests_ project outputs, as they were subsumed into TestHostApp
      # - All PDB files inside the WindowsTerminal/ output, which do not belong there.
      # - console.dll, which apparently breaks XFGCheck? lol.
      - run: |-
          $binDir = 'bin/${{env.BUILD_PLATFORM}}/${{env.BUILD_CONFIGURATION}}'
          $ImportLibs = Get-ChildItem $binDir -Recurse -File -Filter '*.exp' | ForEach-Object { $_.FullName -Replace "exp$","lib" }
          $StaticLibs = Get-ChildItem $binDir -Recurse -File -Filter '*.lib' | Where-Object FullName -NotIn $ImportLibs

          $Items = @()
          $Items += $StaticLibs
          If ($StaticLibs.Length -Gt 0) {
            $Items += Get-Item ($StaticLibs.FullName -Replace "lib$","pdb") -ErrorAction:Ignore
          }
          $Items += Get-ChildItem $binDir -Directory -Filter '*Lib' -ErrorAction:Ignore
          $Items += Get-ChildItem $binDir -Directory -Filter 'LocalTests_*' -ErrorAction:Ignore
          $Items += Get-ChildItem "${binDir}\WindowsTerminal" -Filter '*.pdb' -ErrorAction:Ignore

          $Items += Get-ChildItem $binDir -Filter 'console.dll'

          $Items | Remove-Item -Recurse -Force -Verbose -ErrorAction:Ignore
        name: Delete expensive build outputs before archival

      - uses: actions/upload-artifact@v7
        with:
          # These artifacts are quite large, and we only use them for the tests and packages
          retention-days: 1
          name: bin-${{matrix.arch}}
          path: bin/${{env.BUILD_PLATFORM}}/${{env.BUILD_CONFIGURATION}}

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86, agent: windows-2025-vs2026 }
          - { arch: x64, agent: windows-2025-vs2026 }
          - { arch: arm64, agent: windows-11-vs2026-arm }
    env:
      BUILD_PLATFORM: |-
        ${{ case(
              matrix.arch == 'Any CPU', 'AnyCPU',
              matrix.arch == 'x86', 'Win32',
              matrix.arch
        ) }}
    runs-on: ${{ matrix.agent }}
    name: Test ${{ matrix.arch }}
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: bin-${{matrix.arch}}
          path: "bin/${{env.BUILD_PLATFORM}}/${{env.BUILD_CONFIGURATION}}"
          merge-multiple: true

      - run: |-
          ./build/scripts/Run-Tests.ps1 `
            -MatchPattern '*unit.test*.dll' `
            -Platform ${env:BUILD_PLATFORM} `
            -Configuration ${env:BUILD_CONFIGURATION} `
            -LogPath 'tests.wtl' `
            -AdditionalTaefArguments "/logOutput:Low" `
            -Root "bin/${env:BUILD_PLATFORM}/${env:BUILD_CONFIGURATION}"
        name: Run Unit Tests

      - run: |-
          ./build/scripts/Run-Tests.ps1 `
            -MatchPattern '*feature.test*.dll' `
            -Platform ${env:BUILD_PLATFORM} `
            -Configuration ${env:BUILD_CONFIGURATION} `
            -LogPath 'tests.wtl' `
            -AdditionalTaefArguments "/logOutput:Low" `
            -Root "bin/${env:BUILD_PLATFORM}/${env:BUILD_CONFIGURATION}"
        name: Run Feature Tests
        if: ${{ success() && matrix.arch == 'x64' || matrix.arch == 'arm64' }}

  pack-msix:
    name: Package MSIXBundle
    runs-on: windows-2025-vs2026
    env:
      # TODO: Change this based on Branding
      BundleStemName: Microsoft.WindowsTerminalCanary
      # cannot be evaluated as env. is illegal at this level  
      # ${{ case(
      #       env.WT_BRANDING == 'Canary', 'Microsoft.WindowsTerminalCanary',
      #       env.WT_BRANDING == 'Preview', 'Microsoft.WindowsTerminalPreview',
      #       env.WT_BRANDING == 'Release', 'Microsoft.WindowsTerminal',
      #       'WindowsTerminalDev'
      # ) }}
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: '*.msix'
          skip-decompress: true
          merge-multiple: true
          path: _msix/

      - run: |-
          $VersionEpoch = 3000
          $Components = "${env:XES_APPXMANIFESTVERSION}" -Split "\."
          $Components[0] = ([int]$Components[0] + $VersionEpoch)
          $BundleVersion = $Components -Join "."
          # TODO: I removed the publisher identity from this step. Consider reintroducing it?
          $BundleName = "${{ env.BundleStemName }}_${env:XES_APPXMANIFESTVERSION}.msixbundle"
          New-Item -Type Directory "_bundle"
          $BundlePath = "_bundle\${BundleName}"
          .\build\scripts\Create-AppxBundle.ps1 -InputPath '_msix/' -ProjectName CascadiaPackage -BundleVersion $BundleVersion -OutputPath $BundlePath
          Write-Host "##vso[task.setvariable variable=MsixBundlePath]${BundlePath}"
          "BUNDLE_NAME=${BundleName}" >> "$Env:GITHUB_ENV"
          "BUNDLE_PATH=${BundlePath}" >> "$Env:GITHUB_ENV"
        name: Create MSIX Bundle

      - run: |-
          tar -c -v --format=zip -f "GroupPolicyTemplates_${env:XES_APPXMANIFESTVERSION}.zip" -C "policies" *
        name: Package GPO Templates

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUNDLE_NAME }}
          path: ${{ env.BUNDLE_PATH }}
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          name: GroupPolicyTemplates_${{ env.XES_APPXMANIFESTVERSION }}.zip
          path: GroupPolicyTemplates_${{ env.XES_APPXMANIFESTVERSION }}.zip
          archive: false

  pack-conpty:
    name: Package ConPTY
    runs-on: windows-2025-vs2026
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: nuget/setup-nuget@v4

      - uses: actions/download-artifact@v8
        with: { name: bin-x64, path: bin/x64/${{env.BUILD_CONFIGURATION}} }

      - uses: actions/download-artifact@v8
        with: { name: bin-x86, path: bin/Win32/${{env.BUILD_CONFIGURATION}} }

      - uses: actions/download-artifact@v8
        with: { name: bin-arm64, path: bin/ARM64/${{env.BUILD_CONFIGURATION}} }

      - run: |-
          New-Item -Type Directory package
          nuget pack src/winconpty/package/winconpty.nuspec -OutputDirectory package -Version ${{env.XES_PACKAGEVERSIONNUMBER}}
          $i = Get-Item package/*.nupkg
          "PACKAGE_NAME=$($i.Name)" >> "$Env:GITHUB_ENV"
          "PACKAGE_PATH=$($i.FullName)" >> "$Env:GITHUB_ENV"
        name: NuGet Pack

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_PATH }}
          archive: false
