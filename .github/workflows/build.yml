
name: Build Windows Terminal

on:
  workflow_dispatch:
    inputs:
      output_format:
        description: "Select build artifacts"
        required: true
        type: choice
        default: both
        options:
          - raw
          - installer
          - msixbundle
          - both

      configuration:
        description: "Build configuration"
        required: true
        type: choice
        default: Release
        options:
          - Debug
          - Release

      platform:
        description: "Target platform"
        required: true
        type: choice
        default: x64
        options:
          - x64
          - ARM64

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Terminal (${{ inputs.platform }} / ${{ inputs.configuration }})
    runs-on: windows-latest

    steps:
      # 1. Checkout source
      - name: Checkout Windows Terminal source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # 2. Initialize MSBuild
      - name: Initialize MSBuild
        uses: microsoft/setup-msbuild@v3

      # 3. Initialize NuGet
      - name: Initialize NuGet
        uses: nuget/setup-nuget@v3

      # 4. Configure vcpkg
      - name: Configure vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      # 5. Validate build options
      - name: Configure build options
        id: options
        shell: pwsh
        env:
          OUTPUT_FORMAT: ${{ inputs.output_format || 'both' }}
          CONFIGURATION: ${{ inputs.configuration || 'Release' }}
          PLATFORM: ${{ inputs.platform || 'x64' }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:OUTPUT_FORMAT -notin @(
            "raw", "installer", "msixbundle", "both"
          )) {
            throw "Invalid output format: $env:OUTPUT_FORMAT"
          }

          if ($env:CONFIGURATION -notin @("Debug", "Release")) {
            throw "Invalid configuration: $env:CONFIGURATION"
          }

          if ($env:PLATFORM -notin @("x64", "ARM64")) {
            throw "Invalid platform: $env:PLATFORM"
          }

          "mode=$env:OUTPUT_FORMAT" >> $env:GITHUB_OUTPUT
          "configuration=$env:CONFIGURATION" >> $env:GITHUB_OUTPUT
          "platform=$env:PLATFORM" >> $env:GITHUB_OUTPUT

          Write-Host "Output: $env:OUTPUT_FORMAT"
          Write-Host "Configuration: $env:CONFIGURATION"
          Write-Host "Platform: $env:PLATFORM"

      # 6. Restore dependencies and build
      - name: Restore dependencies and build Windows Terminal
        shell: pwsh
        env:
          CONFIGURATION: ${{ steps.options.outputs.configuration }}
          PLATFORM: ${{ steps.options.outputs.platform }}
        run: |
          $ErrorActionPreference = "Stop"

          $logDir = ".\artifacts\logs"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          $transcriptLog = Join-Path $logDir "workflow-transcript.log"
          $consoleLog = Join-Path $logDir "msbuild-console.log"
          $diagnosticLog = Join-Path $logDir "msbuild-diagnostic.log"
          $binaryLog = Join-Path $logDir "msbuild.binlog"

          Start-Transcript -Path $transcriptLog -Force

          try {
            Write-Host "========================================"
            Write-Host " Windows Terminal Build Environment"
            Write-Host "========================================"

            # Restore solution NuGet dependencies
            Write-Host "`n[1/4] Restoring solution NuGet packages..."

            & nuget restore .\OpenConsole.slnx `
              -NonInteractive `
              -Verbosity detailed

            if ($LASTEXITCODE -ne 0) {
              throw "Solution NuGet restore failed! Exit code: $LASTEXITCODE"
            }

            # Restore centralized native NuGet dependencies
            Write-Host "`n[2/4] Restoring native NuGet packages..."

            & nuget restore .\dep\nuget\packages.config `
              -PackagesDirectory .\packages `
              -NonInteractive `
              -Verbosity detailed

            if ($LASTEXITCODE -ne 0) {
              throw "Native NuGet restore failed! Exit code: $LASTEXITCODE"
            }

            # Verify WIL package
            Write-Host "`nVerifying WIL package..."

            $wilPackages = @(
              Get-ChildItem ".\packages" -Directory |
                Where-Object {
                  $_.Name -like "Microsoft.Windows.ImplementationLibrary.*" -and
                  (Test-Path (
                    Join-Path $_.FullName `
                      "build\native\Microsoft.Windows.ImplementationLibrary.targets"
                  ))
                }
            )

            if ($wilPackages.Count -eq 0) {
              throw "WIL package is missing or incomplete!"
            }

            $wilPackages | ForEach-Object {
              Write-Host "WIL: $($_.Name)"
            }

            # Initialize official build environment
            Write-Host "`n[3/4] Initializing Windows Terminal build environment..."

            Import-Module .\tools\OpenConsole.psm1 -Force
            Set-MsBuildDevEnvironment

            $msbuild = (Get-Command MSBuild.exe -ErrorAction Stop).Source

            Write-Host "MSBuild: $msbuild"
            Write-Host "Configuration: $env:CONFIGURATION"
            Write-Host "Platform: $env:PLATFORM"

            # Build Windows Terminal MSIX
            Write-Host "`n[4/4] Building Windows Terminal..."

            $msbuildArgs = @(
              ".\OpenConsole.slnx"
              "/p:Configuration=$env:CONFIGURATION"
              "/p:Platform=$env:PLATFORM"
              "/p:AppxSymbolPackageEnabled=false"
              "/t:Terminal\CascadiaPackage"
              "/m"
              "/v:diag"
              "/nologo"
              "/fl"
              "/flp:logfile=$diagnosticLog;verbosity=diagnostic"
              "/bl:$binaryLog"
            )

            & $msbuild @msbuildArgs 2>&1 |
              Tee-Object -FilePath $consoleLog

            $buildExitCode = $LASTEXITCODE

            Write-Host "Build Exit Code: $buildExitCode"

            if ($buildExitCode -ne 0) {
              throw "Windows Terminal build failed! Exit code: $buildExitCode"
            }

            Write-Host "Windows Terminal build completed successfully!"
          }
          finally {
            Stop-Transcript
          }

      # 7. Prepare, sign and package selected artifacts
      - name: Prepare Windows Terminal artifacts
        shell: pwsh
        env:
          OUTPUT_FORMAT: ${{ steps.options.outputs.mode }}
          CONFIGURATION: ${{ steps.options.outputs.configuration }}
          PLATFORM: ${{ steps.options.outputs.platform }}

          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}

        run: |
          $ErrorActionPreference = "Stop"

          $appPackages = ".\src\cascadia\CascadiaPackage\AppPackages"
          $outputRoot = ".\artifacts\output"

          New-Item -ItemType Directory -Force -Path $outputRoot | Out-Null

          if (!(Test-Path $appPackages)) {
            throw "AppPackages directory not found!"
          }

          # ========================================
          # 1. Find package directory
          # ========================================

          Write-Host "`nSearching package directories..."
          Write-Host "AppPackages: $appPackages"
          Write-Host "Target platform: $env:PLATFORM"
          Write-Host "Configuration: $env:CONFIGURATION"

          $allPackageDirs = @(
            Get-ChildItem $appPackages -Directory
          )

          Write-Host "`nAvailable package directories:"

          $allPackageDirs | ForEach-Object {
            Write-Host "  $($_.Name)"
          }

          # Configuration is not necessarily included in directory name.
          # Match architecture and Test suffix only.

          $expectedPattern = "_$([regex]::Escape($env:PLATFORM))_Test$"

          $packageDirs = @(
            $allPackageDirs |
              Where-Object {
                $_.Name -match $expectedPattern -and
                (Test-Path (Join-Path $_.FullName "Add-AppDevPackage.ps1"))
              } |
              Sort-Object LastWriteTime -Descending
          )

          if ($packageDirs.Count -eq 0) {
            throw @"
          No matching package directory found!

          Platform: $env:PLATFORM
          Configuration: $env:CONFIGURATION
          Expected suffix: _$($env:PLATFORM)_Test

          Available directories:
          $($allPackageDirs.Name -join "`n")
          "@
          }

          if ($packageDirs.Count -gt 1) {
            Write-Warning "Multiple matching package directories found. Selecting the newest."
          }

          $packageDir = $packageDirs[0]

          Write-Host "`nSelected package directory:"
          Write-Host $packageDir.FullName

          # ========================================
          # 2. Find MSIX package
          # ========================================

          $msixFiles = @(
            Get-ChildItem $packageDir.FullName -File -Filter "*_$($env:PLATFORM).msix"
          )

          if ($msixFiles.Count -ne 1) {
            throw "Expected exactly one $($env:PLATFORM) MSIX, found $($msixFiles.Count)!"
          }

          $msix = $msixFiles[0]

          Write-Host "Selected MSIX: $($msix.FullName)"

          # ========================================
          # 3. Initialize Windows SDK tools
          # ========================================

          Import-Module .\tools\OpenConsole.psm1 -Force
          Set-MsBuildDevEnvironment

          $makeappx = (Get-Command makeappx.exe -ErrorAction Stop).Source

          # ========================================
          # 4. Resolve signing configuration
          # ========================================

          $signingEnabled = -not [string]::IsNullOrWhiteSpace($env:PFX_BASE64)

          $pfx = $null
          $signtool = $null

          if ($signingEnabled) {
            Write-Host "`nSigning is enabled."

            $pfx = Join-Path $env:RUNNER_TEMP "SigningCert.pfx"

            [IO.File]::WriteAllBytes(
              $pfx,
              [Convert]::FromBase64String($env:PFX_BASE64)
            )

            $signtoolCandidates = @(
              Get-ChildItem `
                "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" `
                -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending
            )

            if ($signtoolCandidates.Count -eq 0) {
              throw "signtool.exe not found in Windows Kits!"
            }

            $signtool = $signtoolCandidates[0].FullName

            Write-Host "SignTool: $signtool"

            function Sign-Package {
              param(
                [Parameter(Mandatory = $true)]
                [string]$File
              )

              Write-Host "`nSigning: $File"

              $signArgs = @(
                "sign"
                "/fd", "SHA256"
                "/f", $pfx
                "/tr", "http://timestamp.digicert.com"
                "/td", "SHA256"
              )

              if (-not [string]::IsNullOrEmpty($env:PFX_PASSWORD)) {
                $signArgs += @("/p", $env:PFX_PASSWORD)
              }

              $signArgs += $File

              & $signtool @signArgs

              if ($LASTEXITCODE -ne 0) {
                throw "SignTool failed for $File! Exit code: $LASTEXITCODE"
              }

              Write-Host "Successfully signed: $File"
            }

            # Sign original MSIX first
            Sign-Package -File $msix.FullName
          }
          else {
            Write-Warning "No signing certificate configured. Packages will remain unsigned."
          }

          # ========================================
          # 5. Generate MSIXBundle
          # ========================================

          if ($env:OUTPUT_FORMAT -in @("msixbundle", "both")) {
            Write-Host "`nPreparing MSIXBundle artifact..."

            $bundlePath = Join-Path $outputRoot `
              "WindowsTerminal-$($env:PLATFORM)-$($env:CONFIGURATION).msixbundle"

            $mappingFile = Join-Path $env:RUNNER_TEMP "mapping.txt"

            $mappingContent = @"
          [Files]
          "$($msix.FullName)" "$($msix.Name)"
          "@

            Set-Content -Path $mappingFile -Value $mappingContent -Encoding utf8

            & $makeappx bundle `
              /v `
              /f $mappingFile `
              /p $bundlePath `
              /o

            if ($LASTEXITCODE -ne 0) {
              throw "MakeAppx bundle failed! Exit code: $LASTEXITCODE"
            }

            if (!(Test-Path $bundlePath)) {
              throw "MSIXBundle was not generated!"
            }

            Write-Host "MSIXBundle created: $bundlePath"

            # Bundle must be signed after generation
            if ($signingEnabled) {
              Sign-Package -File $bundlePath
            }
          }

          # ========================================
          # 6. Generate RAW artifact
          # ========================================

          if ($env:OUTPUT_FORMAT -in @("raw", "both")) {
            Write-Host "`nPreparing RAW artifact..."

            $rawDir = Join-Path $outputRoot "RAW"

            $rawZip = Join-Path $outputRoot `
              "WindowsTerminal-RAW-$($env:PLATFORM)-$($env:CONFIGURATION).zip"

            if (Test-Path $rawDir) {
              Remove-Item $rawDir -Recurse -Force
            }

            New-Item -ItemType Directory -Force -Path $rawDir | Out-Null

            & $makeappx unpack `
              /p $msix.FullName `
              /d $rawDir `
              /o

            if ($LASTEXITCODE -ne 0) {
              throw "MSIX unpack failed! Exit code: $LASTEXITCODE"
            }

            if (Test-Path $rawZip) {
              Remove-Item $rawZip -Force
            }

            Compress-Archive `
              -Path "$rawDir\*" `
              -DestinationPath $rawZip `
              -CompressionLevel Optimal `
              -Force

            Write-Host "RAW artifact created: $rawZip"
          }

          # ========================================
          # 7. Generate Installer artifact
          # ========================================

          if ($env:OUTPUT_FORMAT -in @("installer", "both")) {
            Write-Host "`nPreparing Installer artifact..."

            $installerDir = Join-Path $outputRoot "Installer"

            $installerZip = Join-Path $outputRoot `
              "WindowsTerminal-Installer-$($env:PLATFORM)-$($env:CONFIGURATION).zip"

            if (Test-Path $installerDir) {
              Remove-Item $installerDir -Recurse -Force
            }

            New-Item -ItemType Directory -Force -Path $installerDir | Out-Null

            $copiedPackage = Join-Path $installerDir $packageDir.Name

            New-Item -ItemType Directory -Force -Path $copiedPackage | Out-Null

            Get-ChildItem $packageDir.FullName -Force |
              Copy-Item -Destination $copiedPackage -Recurse -Force

            if (Test-Path $installerZip) {
              Remove-Item $installerZip -Force
            }

            Compress-Archive `
              -Path "$installerDir\*" `
              -DestinationPath $installerZip `
              -CompressionLevel Optimal `
              -Force

            Write-Host "Installer artifact created: $installerZip"
          }

          # ========================================
          # 8. Verify generated artifacts
          # ========================================

          Write-Host "`n========================================"
          Write-Host " Generated Artifacts"
          Write-Host "========================================"

          $generatedFiles = @(
            Get-ChildItem $outputRoot -File -Recurse
          )

          if ($generatedFiles.Count -eq 0) {
            throw "No artifacts were generated!"
          }

          $generatedFiles |
            Select-Object FullName, Length |
            Format-Table -AutoSize

          $expectedFiles = @()

          if ($env:OUTPUT_FORMAT -in @("raw", "both")) {
            $expectedFiles += Join-Path $outputRoot `
              "WindowsTerminal-RAW-$($env:PLATFORM)-$($env:CONFIGURATION).zip"
          }

          if ($env:OUTPUT_FORMAT -in @("installer", "both")) {
            $expectedFiles += Join-Path $outputRoot `
              "WindowsTerminal-Installer-$($env:PLATFORM)-$($env:CONFIGURATION).zip"
          }

          if ($env:OUTPUT_FORMAT -in @("msixbundle", "both")) {
            $expectedFiles += Join-Path $outputRoot `
              "WindowsTerminal-$($env:PLATFORM)-$($env:CONFIGURATION).msixbundle"
          }

          foreach ($file in $expectedFiles) {
            if (!(Test-Path $file)) {
              throw "Expected artifact is missing: $file"
            }

            if ((Get-Item $file).Length -eq 0) {
              throw "Artifact is empty: $file"
            }
          }

          Write-Host "`nAll requested artifacts verified successfully!"

          # Cleanup signing certificate
          if ($pfx -and (Test-Path $pfx)) {
            Remove-Item $pfx -Force
          }

      # 8. Upload diagnostic logs
      - name: Upload complete build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WindowsTerminal-Build-Logs-${{ steps.options.outputs.platform }}-${{ steps.options.outputs.configuration }}
          path: artifacts/logs/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30

      # 9. Upload RAW
      - name: Upload Windows Terminal RAW
        if: success() && (steps.options.outputs.mode == 'raw' || steps.options.outputs.mode == 'both')
        uses: actions/upload-artifact@v4
        with:
          name: WindowsTerminal-RAW-${{ steps.options.outputs.platform }}-${{ steps.options.outputs.configuration }}
          path: artifacts/output/WindowsTerminal-RAW-${{ steps.options.outputs.platform }}-${{ steps.options.outputs.configuration }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # 10. Upload Installer
      - name: Upload Windows Terminal Installer
        if: success() && (steps.options.outputs.mode == 'installer' || steps.options.outputs.mode == 'both')
        uses: actions/upload-artifact@v4
        with:
          name: WindowsTerminal-Installer-${{ steps.options.outputs.platform }}-${{ steps.options.outputs.configuration }}
          path: artifacts/output/WindowsTerminal-Installer-${{ steps.options.outputs.platform }}-${{ steps.options.outputs.configuration }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # 11. Upload MSIXBundle
      - name: Upload Windows Terminal MSIXBundle
        if: success() && (steps.options.outputs.mode == 'msixbundle' || steps.options.outputs.mode == 'both')
        uses: actions/upload-artifact@v4
        with:
          name: WindowsTerminal-MSIXBundle-${{ steps.options.outputs.platform }}-${{ steps.options.outputs.configuration }}
          path: artifacts/output/WindowsTerminal-${{ steps.options.outputs.platform }}-${{ steps.options.outputs.configuration }}.msixbundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
